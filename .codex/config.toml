# .codex/config.toml

approval_policy = "on-failure"
sandbox_mode = "workspace-write"

[projects."/Users/arne.defauw/VIB/harpy_vitessce"]
trust_level = "trusted"

[projects."/Users/arne.defauw/VIB"]
trust_level = "trusted"

[plugins."github@openai-curated"]
enabled = true

[sandbox_workspace_write]
network_access = true
writable_roots = [
  "/Users/arne.defauw/VIB",
  "/Users/arne.defauw/Library/Caches/napari",
  "/Users/arne.defauw/Library/Caches/",
  "/Users/arne.defauw/VIB/.codex-home",
  "/Users/arne.defauw/VIB/harpy_vitessce/.cache/codex",
