[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harpy-vitessce"
version = "0.1.2"
description = "Utilities for working with Harpy and Vitessce data."
requires-python = ">=3.12"
dependencies = [
    "spatialdata>=0.7.3",
    "harpy-analysis>=0.4.2",
    "loguru",
    "lazy-loader>=0.4",
    "vitessce[all]>=3.9.1"
]

[project.optional-dependencies]
globus = [
    "globus_utilities @ git+https://github.com/ArneDefauw/globus_utilities.git@main",
    "python-dotenv",
]
docs = [
    "sphinx>=4.5",
    "sphinx-book-theme>=1.0.0",
    "sphinx_rtd_theme",
    "myst-nb",
    "ipython",
    "sphinxcontrib-bibtex>=1.0.0",
    "sphinx-autodoc-typehints",
    "sphinx-design",
    "sphinx-copybutton",
]
#pip install -e ".[vitessce]"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
